name: Build SUSANA APK

on:
  workflow_dispatch:
  push:
    branches: [ susana-v3 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aguita
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../SUSANA-v3-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUSANA-v3-apk
          path: SUSANA-v3-debug.apk
          if-no-files-found: error
